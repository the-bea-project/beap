name = "beap"
version = "1.0.0"

description = "A simple HTTP fileserver with upload support."
licences = ["Apache-2.0"]
repository = { type = "github", user = "the-bea-project", repo = "beap" }

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
ewe = ">= 9.0.0 and < 10.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
argv = ">= 1.1.0 and < 2.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
